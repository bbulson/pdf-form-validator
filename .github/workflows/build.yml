name: PDF Validator Demo

on:
  push:
    branches: [ "main" ] # Only runs when you save to main
  workflow_dispatch:     # This keeps a "Run" button on GitHub so you can test manually

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20' # Matches your pom.xml

      - name: Build Fat JAR
        run: mvn clean package

      - name: Run Validator on Demo File
        # We use your actual JAR name and your actual demo folder path
        run: java -jar target/GenerateTestPDF-1.0-SNAPSHOT.jar ./demo-files/your-input.pdf

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: annotated-output
          path: output/ # Make sure your Java code creates this 'output' folder!
