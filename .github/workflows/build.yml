name: PDF Validator Demo

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:      # This creates the "Run workflow" button

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Updated to 21 to match your IntelliJ log

      - name: Build with Maven
        run: mvn clean package

      - name: Run PDF Generator
        # Update 'input.pdf' to match the actual name of the file in your demo-files folder!
        run: java -cp "target/classes:target/lib/*" org.example.CloneAuditPDF ./demo-files/input.pdf

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdf
          path: ./*.pdf # This grabs any PDF created in the main folder
