name: PDF Validator Demo

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch: 

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package

      - name: Run Audit Logic on All Demo Files
        run: |
          # Loop through every pdf in demo-files
          for file in ./demo-files/*.pdf; do
            echo "-----------------------------------"
            java -jar target/GenerateTestPDF-1.0-SNAPSHOT.jar "$file"
          done

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: audit-results-package
          path: |
            ./demo-files/*.pdf
